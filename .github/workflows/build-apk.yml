name: Build APK

# 只手动触发:仓库 Actions 页面 -> Build APK -> Run workflow
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # runner 自带 Android SDK(ANDROID_HOME),这里只负责接受许可协议并装 36 平台,
      # 不再用 setup-android 这个 action(它在交互式许可确认处卡住报错)
      - name: Accept licenses and install SDK platform 36
        run: |
          set +o pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" || echo "sdkmanager install skipped, Gradle will download on demand"
          ls "$ANDROID_HOME/licenses"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 仓库根目录有 backdrop-stack.patch 时才应用;已经合并过则跳过
      - name: Apply backdrop stack patch
        run: |
          if [ -f backdrop-stack.patch ]; then
            if git apply --check backdrop-stack.patch; then
              git apply backdrop-stack.patch
              echo "patch applied"
            else
              echo "::error::补丁无法应用:仓库代码与补丁基于的版本(0.9.109.5)不一致"
              exit 1
            fi
          else
            echo "no patch file, skip"
          fi

      - name: Build release APK
        working-directory: compose-miuix
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pixez-miuix-apk
          path: compose-miuix/composeApp/build/outputs/apk/release/*.apk
          if-no-files-found: error
